[project]
name = "mediaforge-media-worker"
version = "0.1.0"
description = "MediaForge media processing worker"
# 3.11 series exactly: design.md §2.1 pins the worker to Python 3.11 via uv. A range such as
# ">=3.11" would let uv resolve 3.13 on a machine that has it, and the repository would silently
# stop matching its own design.
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic>=2.13.5",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "tests"]

# `mediaforge` is this project's own package (it lives under `src/`), so it belongs in the
# first-party import group, separated from third-party imports like `pytest` and `redis`.
# Declared here because the tooling cannot infer it: without this, an import sorter assumes
# `mediaforge` is third-party and asks for the groups to be merged, which would be wrong for every
# file in the worker.
[tool.ruff.lint.isort]
known-first-party = ["mediaforge"]

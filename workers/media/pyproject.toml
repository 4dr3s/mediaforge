[project]
name = "mediaforge-media-worker"
version = "0.1.0"
description = "MediaForge media processing worker"
# 3.11 series exactly: design.md §2.1 pins the worker to Python 3.11 via uv. A range such as
# ">=3.11" would let uv resolve 3.13 on a machine that has it, and the repository would silently
# stop matching its own design.
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "tests"]
